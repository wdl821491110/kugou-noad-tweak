name: Build KGNoAd dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: Build tweak
        run: |
          cd $GITHUB_WORKSPACE
          make clean || true
          make -j2 DEBUG=0
          ls -la .theos/obj/

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          # release 构建：唯一产物在 .theos/obj/kugou_noad_v9c.dylib
          cp .theos/obj/kugou_noad_v9c.dylib $GITHUB_WORKSPACE/out/
          ls -la $GITHUB_WORKSPACE/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGNoAd-v9c
          path: out/*
          if-no-files-found: error
